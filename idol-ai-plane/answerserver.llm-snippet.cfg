// Paste into answerserver.cfg on the idol-docker-setup host.
// Models path used by the AI gateway. Agents must not call Ollama directly.

[LLMBackend]
Type=openai
Host=http://ollama:11434
Model=llama3.2
APIVersion=v1
APIKey=ollama
MaxTokens=2048
Temperature=0.1

[MyAnswerSystem]
Type=retrieval_augmented
LLMBackend=LLMBackend
IDOLHost=idol-content
IDOLPort=9100
NumberOfResults=5
MaxContextTokens=4096
SystemPrompt=You are an intelligent assistant. Answer questions using only the provided context. If the answer is not in the context, say "I don't have enough information to answer that."
