<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Host page embedding KD NiFi chat</title>
  <style>
    body { font: 16px/1.4 system-ui; margin: 24px; color: #111; }
    h1 { font-size: 20px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Other application</h1>
  <p>This page is not the assistant. It only hosts the inline element pointed at <code>http://localhost:27120/</code>.</p>

  <!-- 1. Load the element definition from the UI container -->
  <script src="http://localhost:27120/embed.js"></script>

  <!-- 2. Drop the assistant anywhere -->
  <kd-nifi-chat src="http://localhost:27120/" height="720px"></kd-nifi-chat>
</body>
</html>
